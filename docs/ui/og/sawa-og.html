<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#EEF3F0;position:relative;font-family:"Plus Jakarta Sans",sans-serif;color:#102B2A}
svg.map{position:absolute;inset:0}
.txt{position:absolute;left:84px;top:96px;width:620px}
.logo{font-family:Fredoka;font-weight:600;font-size:168px;line-height:.9;color:#17706F;letter-spacing:-3px}
.logo i{font-style:normal;color:#F2755F}
h1{margin-top:22px;font-size:54px;font-weight:800;letter-spacing:-1.4px;line-height:1.05}
p{margin-top:18px;font-size:27px;font-weight:500;color:#4C6462;line-height:1.38;max-width:520px}
.chip{margin-top:34px;display:inline-flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:12px 22px 12px 14px;font-size:22px;font-weight:700;color:#0F5554;box-shadow:0 8px 24px rgba(16,43,42,.08)}
.chip b{width:34px;height:34px;border-radius:50%;background:#17706F;display:grid;place-items:center}
.halo{position:absolute;right:20px;top:40px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#DDF2E9 0%,#DDF2E9 58%,rgba(221,242,233,0) 71%)}
img{position:absolute;right:-6px;bottom:-34px;width:620px;filter:drop-shadow(0 24px 30px rgba(16,43,42,.16))}
</style></head><body>
<svg class="map" width="1200" height="630" viewBox="0 0 1200 630">

<div class="halo"></div>
