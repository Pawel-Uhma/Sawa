<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>B · Zasięg historii</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="_wspolne.css" rel="stylesheet">
<script src="_dane.js"></script><script src="_mapa.js"></script>
<style>
  .gora { position: absolute; top: 54px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 20; }
  .gora .logo { font-size: 26px; padding: 0 16px; height: 44px; border-radius: 22px; display: flex; align-items: center; }
  .gora .pill { height: 44px; border-radius: 22px; }

  .licznik { position: absolute; top: 108px; left: 50%; transform: translateX(-50%); z-index: 20; height: 36px; border-radius: 18px;
    padding: 0 14px 0 8px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; white-space: nowrap; }
  .licznik b { width: 20px; height: 20px; border-radius: 50%; background: var(--koral); border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(242,117,95,.4); }
  .licznik span { color: var(--tekst-2); font-weight: 500; }

  .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 368px; z-index: 30; border-radius: 28px 28px 0 0;
    background: #fff; box-shadow: 0 -10px 40px rgba(16, 43, 42, .14); padding: 22px 20px 0; }
  .pytanie { text-align: center; font-size: 15px; color: var(--tekst-2); font-weight: 600; }
  .odczyt { text-align: center; font-size: 46px; font-weight: 800; letter-spacing: -.04em; line-height: 1.1; margin-top: 2px; }
  .odczyt small { font-size: 26px; letter-spacing: -.02em; color: var(--tekst-2); font-weight: 700; }

  .linijka { position: relative; height: 58px; margin: 12px -20px 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); }
  .kreska { position: absolute; top: 6px; width: 2px; height: 14px; border-radius: 1px; background: #CBD5D2; transform: translateX(-1px); }
  .kreska.duza { height: 26px; top: 0; background: #8FA19E; }
  .opis { position: absolute; top: 34px; transform: translateX(-50%); font-size: 12.5px; font-weight: 700; color: var(--tekst-3); white-space: nowrap; }
  .wskaznik { position: absolute; left: 50%; top: -2px; width: 4px; height: 32px; margin-left: -2px; border-radius: 2px; background: var(--koral); z-index: 31; }

  .statystyki { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 6px; border-top: 1px solid var(--linia); padding-top: 14px; }
  .statystyki div { text-align: center; }
  .statystyki strong { display: block; font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
  .statystyki span { font-size: 12px; color: var(--tekst-3); font-weight: 600; }
  .statystyki div + div { border-left: 1px solid var(--linia); }
  .dol { margin-top: 18px; }
</style></head>
<body><div class="telefon">
  <div class="mapa" id="mapa"></div>
  <div class="mgla"></div>
  <div class="status"></div>

  <div class="gora">
    <div class="logo szklo">sawa<i>.</i></div>
    <div class="pill szklo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17706F" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      Powstanie, kina, bazary
    </div>
  </div>

  <div class="licznik szklo"><b></b>326 miejsc z historią <span>w zasięgu</span></div>

  <div class="panel">
    <div class="pytanie">Ile masz czasu na przejażdżkę?</div>
    <div class="odczyt">1 h 15 <small>min</small></div>
    <div class="linijka" id="linijka"></div>
    <div class="statystyki">
      <div><strong>14 km</strong><span>trasy</span></div>
      <div><strong>2</strong><span>przesiadki</span></div>
      <div><strong>9</strong><span>opowieści</span></div>
    </div>
    <div class="dol"><div class="przycisk">Jedziemy</div></div>
  </div>
  <div class="home"></div>
</div>
<script src="_ui.js"></script>
<script>
  // Linijka: 10 px na 5 minut, środek = 75 min
  const L = document.getElementById('linijka'), srodek = 195, wybrane = 75;
  for (let min = 30; min <= 240; min += 5) {
    const x = srodek + (min - wybrane) * 2;
    if (x < -20 || x > 410) continue;
    const k = document.createElement('div'); k.className = 'kreska' + (min % 30 === 0 ? ' duza' : ''); k.style.left = x + 'px'; L.appendChild(k);
    if (min % 30 === 0) {
      const o = document.createElement('div'); o.className = 'opis'; o.style.left = x + 'px';
      o.textContent = min < 60 ? min + ' min' : (min % 60 ? Math.floor(min / 60) + ' h 30' : min / 60 + ' h'); L.appendChild(o);
    }
  }
  L.insertAdjacentHTML('beforeend', '<div class="wskaznik"></div>');
  sawaMapa('mapa', { zoom: 13.05, center: nad(JA, 140, 13.05), zasiegKm: 1, miejsca: true, miejscaR: 3.5 });
</script>
</body></html>
