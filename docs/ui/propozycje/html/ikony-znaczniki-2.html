<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Znaczniki miejsc 2</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="_wspolne.css" rel="stylesheet">
<script src="_dane.js"></script><script src="_mapa.js"></script>
<style>
  html, body { width: auto; height: auto; overflow: auto; background: #F4F6F5; }
  .siatka { display: flex; gap: 24px; padding: 28px; width: max-content; }
  .wariant { width: 390px; }
  .naglowek { height: 92px; }
  .naglowek h2 { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
  .naglowek h2 span { color: var(--koral); margin-right: 6px; }
  .naglowek p { font-size: 13px; color: var(--tekst-2); margin-top: 4px; line-height: 1.4; }
  .ramka { position: relative; width: 390px; height: 600px; border-radius: 28px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(16,43,42,.06), 0 12px 32px rgba(16,43,42,.12); background: #EEF3F0; }
  .ramka .mapa { position: absolute; inset: 0; }
  .lupa { position: absolute; right: 14px; bottom: 14px; width: 178px; height: 178px; border-radius: 50%; overflow: hidden;
    border: 4px solid #fff; box-shadow: 0 10px 28px rgba(16,43,42,.22); background: #EEF3F0; }
  .lupa .mapa { position: absolute; inset: 0; }
  .lupa-podpis { position: absolute; right: 22px; bottom: 200px; font-size: 11.5px; font-weight: 700; color: var(--tekst-2);
    background: rgba(255,255,255,.85); padding: 3px 9px; border-radius: 10px; }
  .zoom { position: absolute; left: 14px; top: 14px; font-size: 11.5px; font-weight: 700; color: var(--tekst-2);
    background: rgba(255,255,255,.85); padding: 3px 9px; border-radius: 10px; }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 14px; font-size: 12px; color: var(--tekst-2); }
  .legenda div { display: flex; align-items: center; gap: 6px; }
  .legenda img { width: 28px; height: 28px; object-fit: contain; }
  .ja { width: 18px; height: 18px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(37,99,235,.18); }
</style></head>
<body>
<div class="siatka" id="siatka"></div>
<script>
// Rodzaje i kolory jak w apps/web/src/features/map/lib/map-style.ts.
// Prościej: jeden pełny glif na kolor (5 zamiast 9), żeby rozpoznać z daleka.
const GLIFY = {
  architektura: 'M4.5 21V8l7.5-5 7.5 5v13h-5.5v-5h-4v5Z M8 9.5h2.5v2.5H8Z M13.5 9.5H16v2.5h-2.5Z',
  pamiec: 'M10 4.5 12 2l2 2.5V16h-4Z M6.5 17h11v4h-11Z',
  mural: 'M12 2.5C9 7 5.8 10.6 5.8 14.6a6.2 6.2 0 0 0 12.4 0c0-4-3.2-7.6-6.2-12.1Z',
  sacrum: 'M10.4 2h3.2v5h5v3.2h-5V22h-3.2V10.2h-5V7h5Z',
  miejsce: 'M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9Z',
};
const RODZAJE = {
  budynek:   { kolor: '#4f6d9a', nazwa: 'budynek, ulica',      g: GLIFY.architektura },
  ulica:     { kolor: '#4f6d9a', nazwa: 'ulica',               g: GLIFY.architektura },
  pomnik:    { kolor: '#b5543c', nazwa: 'pomnik, tablica',     g: GLIFY.pamiec },
  tablica:   { kolor: '#b5543c', nazwa: 'tablica',             g: GLIFY.pamiec },
  mural:     { kolor: '#d4902a', nazwa: 'mural',               g: GLIFY.mural },
  swiatynia: { kolor: '#3f7d5a', nazwa: 'świątynia, cmentarz', g: GLIFY.sacrum },
  cmentarz:  { kolor: '#3f7d5a', nazwa: 'cmentarz',            g: GLIFY.sacrum },
  miejsce:   { kolor: '#8e4585', nazwa: 'miejsce, wydarzenie', g: GLIFY.miejsce },
  zdarzenie: { kolor: '#8e4585', nazwa: 'zdarzenie',           g: GLIFY.miejsce },
};
const LEGENDA = ['budynek', 'pomnik', 'mural', 'swiatynia', 'miejsce'];

// Bogactwo udawane z nazwy (w aplikacji przychodzi z /v1/places)
const bogactwo = n => { let h = 0; for (const z of n) h = (h * 31 + z.charCodeAt(0)) >>> 0; return 1 + (h % 40); };

const glif = (g, kolor, x, y, s) =>
  `<g transform="translate(${x} ${y}) scale(${s})"><path d="${g}" fill="${kolor}" fill-rule="evenodd"/></g>`;
const cien = `<defs><filter id="c" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#102B2A" flood-opacity=".3"/></filter></defs>`;

// Wszystkie ok. 30–40 px na ekranie (poprzednio 17–26)
const ROSNIE = ['interpolate', ['linear'], ['zoom'], 14, ['interpolate', ['linear'], ['get', 'b'], 1, .78, 40, .9], 17, ['interpolate', ['linear'], ['get', 'b'], 1, 1, 40, 1.12]];

const WARIANTY = [
  {
    id: 'f', tytul: 'Duży medal',
    opis: 'Kółko 36 px w kolorze grupy, gruba biała obwódka, cień i pełny biały glif. Pięć kształtów: kamienica, obelisk, kropla farby, krzyż, gwiazda.',
    kotwica: 'center',
    svg: r => `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">${cien}
      <circle cx="20" cy="19" r="16" fill="${r.kolor}" stroke="#fff" stroke-width="3" filter="url(#c)"/>
      ${glif(r.g, '#fff', 10.4, 9.4, .8)}</svg>`,
    wielkosc: ROSNIE,
  },
  {
    id: 'g', tytul: 'Balon',
    opis: 'Duża pinezka-balon z pełnym glifem, czubek wbity w miejsce. Najbardziej „klikalna” i widoczna, ale przy gęstych miejscach chowa więcej sąsiadów.',
    kotwica: 'bottom',
    svg: r => `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="48" viewBox="0 0 40 48">${cien}
      <path d="M20 45c-1.6-4.4-5.2-7.8-9-11.3a15.5 15.5 0 1 1 18 0c-3.8 3.5-7.4 6.9-9 11.3Z" fill="${r.kolor}" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" filter="url(#c)"/>
      ${glif(r.g, '#fff', 11.2, 9.4, .74)}</svg>`,
    wielkosc: ROSNIE,
  },
  {
    id: 'h', tytul: 'Kafelek',
    opis: 'Zaokrąglony kwadrat w kolorze grupy, jak ikona aplikacji, z białym glifem. Kwadrat odróżnia miejsca od okrągłej kropki „Ty” i przystanków.',
    kotwica: 'center',
    svg: r => `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">${cien}
      <rect x="4.5" y="3.5" width="31" height="31" rx="9.5" fill="${r.kolor}" stroke="#fff" stroke-width="3" filter="url(#c)"/>
      ${glif(r.g, '#fff', 10.4, 9.4, .8)}</svg>`,
    wielkosc: ROSNIE,
  },
];

const fc = {
  type: 'FeatureCollection',
  features: SAWA.miejsca.filter(p => RODZAJE[p.t]).map((p, i) => {
    const b = bogactwo(p.n);
    return { type: 'Feature', id: i, geometry: { type: 'Point', coordinates: p.c },
      properties: { t: p.t, b, pelny: b > 18, n: p.n.replace(/\s*\(.*\)$/, '') } };
  }),
};

function obraz(svg, px) {
  return new Promise((ok, zle) => {
    const img = new Image(px, px);
    img.onload = () => ok(img); img.onerror = zle;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

// SVG rysujemy w 2x, żeby na Retinie były ostre
const w2x = svg => svg.replace(/width="(\d+)" height="(\d+)"/, (_, w, h) => `width="${w * 2}" height="${h * 2}"`);

async function dodajIkony(m, w) {
  for (const [t, r] of Object.entries(RODZAJE)) {
    for (const pelny of [false, true]) {
      const id = `${w.id}-${t}${pelny ? '-p' : ''}`;
      if (m.hasImage(id)) continue;
      const img = await obraz(w2x(w.svg({ ...r, pelny })));
      if (!m.hasImage(id)) m.addImage(id, img, { pixelRatio: 2 });
    }
  }
}

function warstwy(m, w) {
  m.addSource('miejsca', { type: 'geojson', data: fc });
  const ikona = w.id === 'e'
    ? ['concat', w.id + '-', ['get', 't'], ['case', ['get', 'pelny'], '-p', '']]
    : ['concat', w.id + '-', ['get', 't']];
  const kolor = ['match', ['get', 't'], ...Object.entries(RODZAJE).flatMap(([t, r]) => [t, r.kolor]), '#71717a'];
  if (w.kropkiDo) {
    m.addLayer({ id: 'kropki', type: 'circle', source: 'miejsca', maxzoom: w.kropkiDo, paint: {
      'circle-color': kolor, 'circle-radius': ['interpolate', ['linear'], ['get', 'b'], 1, 4.5, 40, 7],
      'circle-stroke-color': '#fff', 'circle-stroke-width': 1.5, 'circle-opacity': .95 } });
  }
  m.addLayer({ id: 'ikony', type: 'symbol', source: 'miejsca', ...(w.kropkiDo ? { minzoom: w.kropkiDo } : {}), layout: {
    'icon-image': ikona, 'icon-size': w.wielkosc, 'icon-anchor': w.kotwica,
    'icon-padding': 1, 'symbol-sort-key': ['-', 0, ['get', 'b']],
    ...(w.podpisOd ? {
      'text-field': ['step', ['zoom'], '', w.podpisOd, ['get', 'n']], 'text-font': ['Noto Sans Regular'], 'text-size': 11.5,
      'text-anchor': 'left', 'text-offset': [1, 0], 'text-max-width': 9, 'text-optional': true,
    } : {}),
  }, paint: w.podpisOd ? { 'text-color': '#27443F', 'text-halo-color': '#fff', 'text-halo-width': 1.4 } : {} });
}

const siatka = document.getElementById('siatka');
const SRODEK = [20.9842, 52.2385];
for (const w of WARIANTY) {
  const kol = document.createElement('section');
  kol.className = 'wariant';
  kol.innerHTML = `
    <div class="naglowek"><h2><span>${w.id.toUpperCase()}</span>${w.tytul}</h2><p>${w.opis}</p></div>
    <div class="ramka">
      <div class="mapa"></div><div class="zoom">zoom 15</div>
      <div class="lupa-podpis">zbliżenie · zoom 16,8</div>
      <div class="lupa"><div class="mapa"></div></div>
    </div>
    <div class="legenda"></div>`;
  siatka.appendChild(kol);

  for (const t of LEGENDA) {
    const r = RODZAJE[t];
    const d = document.createElement('div');
    d.innerHTML = `<img src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(w.svg({ ...r, pelny: true }))}">${r.nazwa}`;
    kol.querySelector('.legenda').appendChild(d);
  }

  const [duza, mala] = kol.querySelectorAll('.mapa');
  const opcje = { style: 'https://tiles.openfreemap.org/styles/positron', attributionControl: false, interactive: false, preserveDrawingBuffer: true, fadeDuration: 0 };
  for (const [el, center, zoom] of [[duza, SRODEK, 15], [mala, [20.9871, 52.2400], 16.8]]) {
    const m = new maplibregl.Map({ ...opcje, container: el, center, zoom });
    window.MAPY = (window.MAPY || 0) + 1;
    m.on('load', async () => {
      przekoloruj(m, false);
      await dodajIkony(m, w);
      warstwy(m, w);
      m.once('idle', () => { window.GOTOWE = (window.GOTOWE || 0) + 1; });
    });
    const ja = document.createElement('div'); ja.className = 'ja';
    new maplibregl.Marker({ element: ja }).setLngLat(JA).addTo(m);
  }
}
</script>
</body></html>
