<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przejażdżka C · mapa pierwsza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --glebia:#17706F; --mieta:#8ED1B5; --mieta-j:#E4F4EC; --koral:#F2755F; --tekst:#102B2A; --tekst-2:#4F6867; --tekst-3:#8A9B9A; }
  * { box-sizing:border-box; }
  body { margin:0; background:#D9E6E2; font-family:"Plus Jakarta Sans", system-ui, sans-serif; color:var(--tekst); }
  .tel { width:390px; height:844px; margin:0 auto; position:relative; overflow:hidden; background:
    repeating-linear-gradient(0deg, #E9EFEC 0 2px, transparent 2px 46px),
    repeating-linear-gradient(90deg, #E9EFEC 0 2px, transparent 2px 62px), #F3F7F5; }
  .map { position:absolute; inset:0; }
  .map svg { width:100%; height:100%; }
  .route { fill:none; stroke:var(--glebia); stroke-width:6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1200; stroke-dashoffset:0; transition:stroke-dashoffset .6s cubic-bezier(.22,1,.36,1), d .5s; }
  .here { position:absolute; left:177px; top:430px; width:22px; height:22px; border-radius:50%; background:#fff; border:5px solid var(--glebia); box-shadow:0 0 0 10px rgba(23,112,111,.14); }
  .end { position:absolute; width:18px; height:18px; border-radius:50%; background:var(--koral); border:4px solid #fff; box-shadow:0 4px 10px rgba(16,43,42,.25); transition:left .5s, top .5s, opacity .3s; }

  .top { position:absolute; top:58px; left:16px; right:16px; display:flex; gap:10px; align-items:center; }
  .sawa { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.94); border-radius:22px 22px 22px 6px; padding:8px 14px 8px 8px; box-shadow:0 10px 26px rgba(16,43,42,.12); }
  .sawa img { width:46px; height:auto; }
  .sawa b { display:block; font-size:16px; letter-spacing:-.01em; }
  .sawa span { font-size:12px; color:var(--tekst-2); }

  .panel { position:absolute; left:16px; right:16px; bottom:16px; background:rgba(255,255,255,.94); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-radius:28px; padding:16px; box-shadow:0 18px 44px rgba(16,43,42,.2); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .lbl { font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--tekst-3); }
  .dur { white-space:nowrap; font-size:38px; font-weight:800; letter-spacing:-.03em; color:var(--glebia); line-height:1; font-variant-numeric:tabular-nums; }
  .dur small { font-size:18px; letter-spacing:0; margin-left:2px; }
  .seg { display:flex; background:#EEF3F1; border-radius:16px; padding:4px; gap:4px; }
  .seg button { white-space:nowrap; border:0; background:none; height:38px; padding:0 14px; border-radius:12px; font:700 14px/1 inherit; font-family:inherit; color:var(--tekst-2); cursor:pointer; transition:background .2s, color .2s; }
  .seg button.on { background:#fff; color:var(--tekst); box-shadow:0 2px 6px rgba(16,43,42,.1); }
  .ticks { position:relative; height:36px; margin-top:10px; }
  .ticks input { position:absolute; left:0; right:0; top:4px; width:100%; accent-color:var(--glebia); margin:0; }
  .ticks div { position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; font-size:11px; font-weight:600; color:var(--tekst-3); }
  .modes { display:flex; gap:8px; margin-top:12px; }
  .modes button { white-space:nowrap; flex:1; height:42px; border-radius:14px; border:1.5px solid #E0E9E6; background:#fff; font-family:inherit; font-size:14px; font-weight:700; color:var(--tekst-2); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .modes button.on { border-color:var(--glebia); color:var(--glebia); background:var(--mieta-j); }
  .go { margin-top:12px; width:100%; height:56px; border:0; border-radius:20px; background:var(--glebia); color:#fff; font-family:inherit; font-size:17px; font-weight:800; cursor:pointer; box-shadow:0 10px 22px rgba(23,112,111,.3); }
  .go:active { transform:scale(.98); }
</style>
</head>
<body>
<div class="tel">
  <div class="map">
    <svg viewBox="0 0 390 844" preserveAspectRatio="none" aria-hidden="true">
      <path id="route" class="route" d="M195 441 C 110 420, 80 520, 150 600 S 300 640, 280 520 S 250 430, 195 441 Z"/>
    </svg>
  </div>
  <div class="here" aria-hidden="true"></div>
  <div class="end" id="endpin" style="left:186px; top:588px; opacity:0"></div>

  <div class="top">
    <div class="sawa">
      <img src="../../../../apps/web/public/sawa-32.png" alt="" onerror="this.style.display='none'">
      <div><b>Ile masz dziś czasu?</b><span>Ułożę przejazd i opowiem, co mijasz.</span></div>
    </div>
  </div>

  <section class="panel" aria-label="Plan przejazdu">
    <div class="row">
      <div>
        <div class="lbl">Przejażdżka</div>
        <div class="dur" id="dur">1 h 30<small>min</small></div>
      </div>
      <div class="seg" id="end" role="group" aria-label="Gdzie kończysz">
        <button type="button" class="on" data-v="loop">Wracam tu</button>
        <button type="button" data-v="dest">Do celu</button>
      </div>
    </div>
    <div class="ticks">
      <input type="range" min="0" max="5" value="3" id="range" aria-label="Czas przejażdżki">
      <div><span>5 min</span><span>1 h</span><span>4 h+</span></div>
    </div>
    <div class="modes" id="modes" role="group" aria-label="Jak jedziesz">
      <button type="button" class="on" data-v="walk">🚶 Pieszo</button>
      <button type="button" data-v="transit">🚋 Komunikacją</button>
    </div>
    <button type="button" class="go" id="go">Ułóż trasę</button>
  </section>
</div>
<script>
  const steps = ["5 min", "30 min", "1 h", "1 h 30 min", "2 h", "4 h+"];
  const range = document.getElementById("range");
  const dur = document.getElementById("dur");
  const route = document.getElementById("route");
  const endPin = document.getElementById("endpin");
  const loopD = "M195 441 C 110 420, 80 520, 150 600 S 300 640, 280 520 S 250 430, 195 441 Z";
  const lineD = "M195 441 C 230 380, 300 340, 330 290";
  function setDur() {
    const t = steps[range.value];
    dur.innerHTML = t.endsWith("min") ? t.replace(" min", '<small>min</small>') : t.replace(" h", '<small>h</small>');
  }
  function setEnd(type) {
    document.querySelectorAll("#end button").forEach((b) => b.classList.toggle("on", b.dataset.v === type));
    if (type === "loop") {
      route.setAttribute("d", loopD);
      endPin.style.opacity = 0;
    } else {
      route.setAttribute("d", lineD);
      endPin.style.left = "326px"; endPin.style.top = "282px"; endPin.style.opacity = 1;
    }
  }
  range.addEventListener("input", setDur);
  document.querySelectorAll("#end button").forEach((b) => b.addEventListener("click", () => setEnd(b.dataset.v)));
  document.querySelectorAll("#modes button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#modes button").forEach((x) => x.classList.toggle("on", x === b));
  }));
  setDur(); setEnd("loop");
</script>
</body>
</html>
