<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>A · Arkusz na mapie</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="_wspolne.css" rel="stylesheet">
<script src="_dane.js"></script><script src="_mapa.js"></script>
<style>
  .gora { position: absolute; top: 54px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 20; }
  .gora .logo { font-size: 26px; padding: 0 16px; height: 44px; border-radius: 22px; display: flex; align-items: center; }
  .pogoda { height: 44px; border-radius: 22px; }
  .pogoda span { color: var(--tekst-2); font-weight: 500; }

  .zapytaj { position: absolute; right: 16px; top: 368px; z-index: 20; height: 44px; padding: 0 16px 0 6px; border-radius: 22px;
    display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .zapytaj img { width: 32px; height: 32px; }

  .arkusz { position: absolute; left: 0; right: 0; bottom: 0; top: 424px; z-index: 30; border-radius: 28px 28px 0 0;
    background: rgba(255, 255, 255, .9); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 -10px 40px rgba(16, 43, 42, .14); padding: 10px 20px 0; }
  .uchwyt { width: 36px; height: 5px; border-radius: 3px; background: rgba(16, 43, 42, .18); margin: 0 auto 16px; }
  .powitanie { display: flex; gap: 12px; align-items: center; }
  .powitanie img { width: 48px; height: 48px; flex: none; }
  .powitanie h1 { font-size: 22px; line-height: 1.15; letter-spacing: -.02em; font-weight: 800; }
  .powitanie p { font-size: 13.5px; color: var(--tekst-2); margin-top: 2px; line-height: 1.35; }

  .czas { margin-top: 20px; display: flex; justify-content: space-between; align-items: baseline; }
  .czas strong { font-size: 30px; letter-spacing: -.03em; font-weight: 800; color: var(--glebia); }
  .suwak { position: relative; height: 32px; margin-top: 6px; }
  .tor { position: absolute; top: 13px; left: 0; right: 0; height: 6px; border-radius: 3px; background: var(--tlo-2); }
  .tor i { position: absolute; left: 0; top: 0; bottom: 0; width: 34%; border-radius: 3px; background: var(--glebia); }
  .galka { position: absolute; top: 2px; left: calc(34% - 14px); width: 28px; height: 28px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 3px 8px rgba(0,0,0,.18); }
  .skala { display: flex; justify-content: space-between; font-size: 12px; color: var(--tekst-3); font-weight: 600; }

  .tematy { margin-top: 18px; display: flex; gap: 8px; flex-wrap: nowrap; overflow: hidden; }
  .dol { margin-top: 18px; }
  .nastepny { margin-top: 10px; text-align: center; font-size: 12.5px; color: var(--tekst-2); font-weight: 500; }
  .nastepny b { display: inline-grid; place-items: center; min-width: 26px; height: 20px; border-radius: 5px; background: #C8102E; color: #fff; font-size: 12px; margin: 0 2px; }
</style></head>
<body><div class="telefon">
  <div class="mapa" id="mapa"></div>
  <div class="status"></div>

  <div class="gora">
    <div class="logo szklo">sawa<i>.</i></div>
    <div class="pill szklo pogoda">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4C6462" stroke-width="2" stroke-linecap="round"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7Z"/></svg>
      12° <span>Wola</span>
    </div>
  </div>

  <div class="zapytaj szklo"><img class="awatar" src="../../../pitch/img/ikona-sawa.jpg">Zapytaj Sawę</div>

  <div class="arkusz">
    <div class="uchwyt"></div>
    <div class="powitanie">
      <img class="awatar" src="../../../pitch/img/ikona-sawa.jpg">
      <div>
        <h1>Ile masz dziś czasu?</h1>
        <p>Ułożę przejazd tramwajem i autobusem i opowiem, co mijasz za oknem.</p>
      </div>
    </div>

    <div class="czas"><span class="etykieta">Przejażdżka</span><strong>1 h 30 min</strong></div>
    <div class="suwak"><div class="tor"><i></i></div><div class="galka"></div></div>
    <div class="skala"><span>30 min</span><span>1 h</span><span>2 h</span><span>3 h</span><span>4 h+</span></div>

    <div class="tematy">
      <span class="chip wybrany">Powstanie ’44</span>
      <span class="chip wybrany">Dawne kina</span>
      <span class="chip wybrany">Bazary</span>
      <span class="chip">+ zmień</span>
    </div>

    <div class="dol">
      <div class="przycisk">Wyznacz trasę
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="nastepny">Najbliżej: <b>26</b> z przystanku Okopowa za 3 min</div>
    </div>
  </div>
  <div class="home"></div>
</div>
<script src="_ui.js"></script>
<script>
  sawaMapa('mapa', { zoom: 14.8, center: nad(JA, 160, 14.8), pins: [
    { c: [20.98019, 52.23702], n: 'Kercelak' },
    { c: [20.97306, 52.23944], n: 'Cmentarz kalwiński' },
    { c: [20.97213, 52.23268], n: 'Zajezdnia Wola' },
  ] });
</script>
</body></html>
