<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>E · Wieczór</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="_wspolne.css" rel="stylesheet">
<script src="_dane.js"></script><script src="_mapa.js"></script>
<style>
  body, .telefon { background: var(--noc); color: #EAF5F1; }
  .mapa { bottom: auto; height: 430px;
    -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
  .gora { position: absolute; top: 56px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
  .gora .logo { font-size: 26px; color: #fff; }
  .gora .pill { height: 36px; font-size: 13px; color: #CFE6DF; }

  .dol { position: absolute; left: 20px; right: 20px; top: 330px; }
  .sawa { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--mieta); font-weight: 600; }
  .sawa img { width: 36px; height: 36px; }
  h1 { font-size: 34px; line-height: 1.08; letter-spacing: -.035em; font-weight: 800; color: #fff; margin-top: 10px; }

  .koło { position: relative; height: 196px; margin-top: 12px; display: flex; justify-content: center; gap: 4px; }
  .koło::before { content: ''; position: absolute; left: 0; right: 0; top: 70px; height: 56px; border-radius: 14px; background: rgba(142,209,181,.10); }
  .kol { position: relative; width: 140px; text-align: center; display: flex; flex-direction: column; justify-content: center;
    -webkit-mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); }
  .kol div { height: 46px; line-height: 46px; font-size: 26px; font-weight: 600; color: rgba(234,245,241,.4); letter-spacing: -.02em; }
  .kol div.on { font-size: 46px; height: 56px; line-height: 56px; font-weight: 800; color: #fff; }
  .kol div.on small { font-size: 17px; font-weight: 700; color: var(--mieta); margin-left: 6px; letter-spacing: 0; }

  .tematy { display: flex; gap: 8px; margin-top: 6px; }
  .tematy span { height: 32px; padding: 0 12px; border-radius: 16px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 600;
    background: rgba(142,209,181,.12); color: var(--mieta); }
  .przycisk { margin-top: 18px; }
  .info { text-align: center; color: rgba(234,245,241,.55); font-size: 12.5px; margin-top: 10px; }
</style></head>
<body><div class="telefon">
  <div class="mapa" id="mapa"></div>
  <div class="mgla noc"></div>
  <div class="status jasny"></div>
  <div class="gora">
    <div class="logo">sawa<i>.</i></div>
    <div class="pill szklo-ciemne">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8ED1B5" stroke-width="2.2" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      9° · bez deszczu
    </div>
  </div>

  <div class="dol">
    <div class="sawa"><img class="awatar" src="../../../pitch/img/ikona-sawa.jpg">Sawa · 326 historii w okolicy</div>
    <h1>Dobry wieczór.<br>Ile masz czasu?</h1>

    <div class="koło">
      <div class="kol"><div>0</div><div class="on">1<small>godz.</small></div><div>2</div></div>
      <div class="kol"><div>15</div><div class="on">30<small>min</small></div><div>45</div></div>
    </div>

    <div class="tematy"><span>Powstanie ’44</span><span>Dawne kina</span><span>Bazary</span></div>
    <div class="przycisk koral">Jedziemy</div>
    <div class="info">Sawa zacznie mówić, gdy wsiądziesz do tramwaju</div>
  </div>
  <div class="home jasny"></div>
</div>
