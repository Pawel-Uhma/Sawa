<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przejażdżka A · zdanie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --glebia:#17706F; --mieta:#8ED1B5; --mieta-j:#E4F4EC; --koral:#F2755F; --tekst:#102B2A; --tekst-2:#4F6867; --tekst-3:#8A9B9A; }
  * { box-sizing: border-box; }
  body { margin:0; background:#D9E6E2; font-family:"Plus Jakarta Sans", system-ui, sans-serif; color:var(--tekst); }
  .tel { width:390px; height:844px; margin:0 auto; position:relative; overflow:hidden; background:
    radial-gradient(circle at 30% 20%, #F4F8F6 0 35%, transparent 36%),
    repeating-linear-gradient(0deg, #E9EFEC 0 2px, transparent 2px 46px),
    repeating-linear-gradient(90deg, #E9EFEC 0 2px, transparent 2px 62px), #F3F7F5; }
  .park { position:absolute; left:-30px; top:330px; width:200px; height:120px; border-radius:40px; background:#CFE8DA; }
  .river { position:absolute; left:0; right:0; top:560px; height:26px; background:#BFD9E8; transform:rotate(-6deg); }
  .pin { position:absolute; left:178px; top:318px; width:34px; height:34px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:var(--glebia); border:4px solid #fff; box-shadow:0 6px 14px rgba(16,43,42,.25); }
  .dot { position:absolute; left:186px; top:402px; width:18px; height:18px; border-radius:50%; background:#fff; border:4px solid var(--glebia); }
  .sawa { position:absolute; left:14px; top:96px; width:112px; height:auto; }
  .bubble { position:absolute; left:132px; top:112px; right:16px; background:rgba(255,255,255,.92); border-radius:20px 20px 20px 6px; padding:12px 16px; box-shadow:0 10px 30px rgba(16,43,42,.12); }
  .bubble b { display:block; font-size:18px; letter-spacing:-.02em; }
  .bubble span { font-size:13px; color:var(--tekst-2); }

  .card { position:absolute; left:10px; right:10px; bottom:10px; background:#fff; border-radius:32px; padding:22px 20px 20px; box-shadow:0 -10px 40px rgba(16,43,42,.14); }
  .grab { width:40px; height:5px; border-radius:3px; background:#D4DEDC; margin:0 auto 16px; }
  .sentence { font-size:23px; line-height:1.55; font-weight:600; letter-spacing:-.01em; color:var(--tekst-2); }
  .sentence .chip { display:inline-flex; align-items:center; height:34px; padding:0 12px; margin:2px 2px; border-radius:12px; background:var(--mieta-j); color:var(--glebia); font-weight:800; border:0; font-family:inherit; font-size:20px; cursor:pointer; transition:background .2s, color .2s, transform .15s; }
  .sentence .chip:active { transform:scale(.96); }
  .sentence .chip.on { background:var(--glebia); color:#fff; }
  .sentence .chip.dur { background:none; color:var(--glebia); font-size:34px; height:auto; padding:0; letter-spacing:-.03em; font-weight:800; }

  .steps { display:flex; gap:8px; margin-top:16px; }
  .steps button { flex:1; height:44px; border-radius:14px; border:0; background:#F1F5F4; font:600 14px/1 inherit; font-family:inherit; color:var(--tekst-2); cursor:pointer; }
  .steps button.on { background:var(--tekst); color:#fff; }
  .slider { margin:18px 2px 0; }
  .slider input { width:100%; accent-color:var(--glebia); }
  .slider div { display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--tekst-3); margin-top:2px; }

  .go { margin-top:18px; width:100%; height:56px; border:0; border-radius:20px; background:var(--koral); color:#fff; font:800 17px/1 inherit; font-family:inherit; box-shadow:0 10px 22px rgba(242,117,95,.35); cursor:pointer; }
  .go small { display:block; font-size:12px; font-weight:600; opacity:.9; margin-top:4px; }
  .hint { text-align:center; font-size:12px; color:var(--tekst-3); margin:10px 0 0; }
</style>
</head>
<body>
<div class="tel">
  <div class="park"></div>
  <div class="river"></div>
  <div class="pin"></div>
  <div class="dot"></div>
  <img class="sawa" src="../../../../apps/web/public/sawa-32.png" alt="" onerror="this.style.display='none'">
  <div class="bubble"><b>Ile masz dziś czasu?</b><span>Ułożę przejazd i opowiem, co mijasz za oknem.</span></div>

  <section class="card" aria-label="Plan przejazdu">
    <div class="grab"></div>
    <p class="sentence">
      Mam <button class="chip dur" id="dur">1 h 30 min</button><br>
      idę <button class="chip on" data-group="travel" data-v="walk">pieszo</button> albo
      <button class="chip" data-group="travel" data-v="transit">komunikacją</button>,<br>
      <button class="chip on" data-group="end" data-v="loop">wracam tu</button> albo
      <button class="chip" data-group="end" data-v="dest">jadę do celu</button>.
    </p>
    <div class="slider">
      <input type="range" min="0" max="5" value="3" id="range" aria-label="Czas przejażdżki">
      <div><span>5 min</span><span>1 h</span><span>4 h+</span></div>
    </div>
    <button class="go" id="go">Ułóż trasę<small id="sum">1 h 30 min · pieszo · wracam tu</small></button>
    <p class="hint">Zmieniaj słowa w zdaniu. Tematy wybierzesz na osobnym ekranie.</p>
  </section>
</div>
<script>
  const steps = ["5 min", "30 min", "1 h", "1 h 30 min", "2 h", "4 h+"];
  const range = document.getElementById("range");
  const dur = document.getElementById("dur");
  const sum = document.getElementById("sum");
  const labels = { walk: "pieszo", transit: "komunikacją", loop: "wracam tu", dest: "jadę do celu" };
  function refresh() {
    dur.textContent = steps[range.value];
    const travel = document.querySelector('[data-group="travel"].on').dataset.v;
    const end = document.querySelector('[data-group="end"].on').dataset.v;
    sum.textContent = `${steps[range.value]} · ${labels[travel]} · ${labels[end]}`;
  }
  range.addEventListener("input", refresh);
  document.querySelectorAll(".chip[data-group]").forEach((chip) => chip.addEventListener("click", () => {
    document.querySelectorAll(`[data-group="${chip.dataset.group}"]`).forEach((c) => c.classList.toggle("on", c === chip));
    refresh();
  }));
  refresh();
</script>
</body>
</html>
