services:
  waw-proxy:
    build: .
    restart: unless-stopped
    environment:
      PROXY_KEY: ${PROXY_KEY:-}
    ports:
      - "${PROXY_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /config
      - /data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # binarka caddy ma tę file capability, bez niej exec nie przejdzie
    security_opt: [no-new-privileges:true]

  # Opcjonalnie: Cloudflare Tunnel zamiast otwierania portu (docker compose --profile tunnel up -d).
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [waw-proxy]
