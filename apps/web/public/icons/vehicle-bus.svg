<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- body with a white halo so the icon reads on any basemap -->
  <rect x="16" y="5" width="32" height="54" rx="9" fill="url(#body)" stroke="#ffffff" stroke-width="3"/>
  <!-- windshield -->
  <rect x="20.5" y="9.5" width="23" height="10" rx="3.5" fill="url(#glass)"/>
  <path d="M24 11.5h7" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
  <!-- headlights -->
  <circle cx="19.5" cy="8" r="1.8" fill="#fef9c3"/>
  <circle cx="44.5" cy="8" r="1.8" fill="#fef9c3"/>
  <!-- side windows, two per side -->
  <rect x="18.5" y="22" width="4.5" height="12" rx="1.5" fill="url(#glass)"/>
  <rect x="18.5" y="37" width="4.5" height="12" rx="1.5" fill="url(#glass)"/>
  <rect x="41" y="22" width="4.5" height="12" rx="1.5" fill="url(#glass)"/>
  <rect x="41" y="37" width="4.5" height="12" rx="1.5" fill="url(#glass)"/>
  <!-- roof hatch -->
  <rect x="29.5" y="24" width="5" height="22" rx="2" fill="#ffffff" fill-opacity="0.22"/>
  <!-- rear window -->
  <rect x="20.5" y="51" width="23" height="4.5" rx="2" fill="url(#glass)"/>
</svg>
